[project]
name = "fly-in"
version = "1.0.0"
description = "Multi-Drone Routing Optimization & Simulation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyglet>=2.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true